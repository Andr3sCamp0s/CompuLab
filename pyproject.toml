[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compulab"
version = "0.1.0"
description = "Núcleo de dominio y casos de uso para Administración de Laboratorios CompuLab (IC-6821)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["compulab*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
