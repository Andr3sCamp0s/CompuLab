services:
  db:
    image: postgres:14-alpine
    container_name: compulab-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-compulab}
      POSTGRES_USER: ${POSTGRES_USER:-compulab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compulab_dev}
      TZ: America/Costa_Rica
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - compulab_pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-compulab} -d ${POSTGRES_DB:-compulab}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compulab-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-compulab}:${POSTGRES_PASSWORD:-compulab_dev}@db:5432/${POSTGRES_DB:-compulab}
      TZ: America/Costa_Rica
    depends_on:
      db:
        condition: service_healthy
    command: ["pytest", "-v"]

  frontend:
    image: node:20-alpine
    container_name: compulab-frontend
    profiles: ["frontend"]
    working_dir: /app
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  compulab_pgdata:
